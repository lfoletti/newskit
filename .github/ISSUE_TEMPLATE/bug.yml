name: Bug
description: Something does not work the way the documentation says. English or French.
labels: [bug]
body:
  - type: textarea
    id: quoi
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Steps
      description: The shortest steps that show the bug. Remove keys and private data.
      placeholder: |
        1. config.yaml with ...
        2. newskit run --graph ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `newskit --version` and of `python3 --version`.
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Log
      description: The pass report or the error message. Remove keys and private data.
      render: text
