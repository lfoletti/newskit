name: Défaut
description: Quelque chose ne marche pas comme la documentation le dit.
labels: [bug]
body:
  - type: textarea
    id: quoi
    attributes:
      label: Ce qui s'est passé
      description: Ce que vous avez vu, et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Les étapes
      description: Les étapes les plus courtes qui montrent le défaut. Retirez clés et données privées.
      placeholder: |
        1. config.yaml avec ...
        2. newskit routine --graphe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: La sortie de `newskit --version`, et celle de `python3 --version`.
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Journal
      description: Le bilan de la nuit ou le message d'erreur. Retirez clés et données privées.
      render: text
