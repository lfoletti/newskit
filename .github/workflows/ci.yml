name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: installation
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest -q --basetemp=/tmp/essais
      - name: consignes du témoin sans réponse enregistrée
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consignes-manquantes-${{ matrix.python }}
          path: /tmp/essais/**/manquantes/*.json
          if-no-files-found: ignore

  temoin:
    # Le paquet construit, installé hors du dépôt : le témoin passe une nuit depuis la roue, comme chez un utilisateur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: roue
        run: pip install build && python -m build --wheel --outdir dist
      - name: installation hors du dépôt
        run: python -m venv /tmp/v && /tmp/v/bin/pip install "$(ls dist/*.whl)[temoin]"
      - name: une nuit du témoin, dans un dossier vide
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          mkdir /tmp/media && cd /tmp/media && /tmp/v/bin/newskit temoin nuit
          grep -q '"vert": true' cache/temoin_vert

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
