[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "newskit"
dynamic = ["version"]
description = "Un moteur de veille sans thème : il fait naître un graphe de connaissances sur un sujet et le tient à jour chaque nuit, piloté depuis Claude Code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Les mainteneurs de Newskit" }]
keywords = ["knowledge-graph", "claude-code", "news", "monitoring", "rag", "newsletter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "PyYAML>=6.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "pypdf>=4.0",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "graphifyy>=0.9",
    "pytest>=8.0",              # le témoin : une nuit ne part pas sans lui (newskit temoin nuit)
]

[project.optional-dependencies]
# L'encodeur local, le reclasseur et l'export ONNX (encodeur, synthese, decision, exporter_onnx).
encodeur = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "fastembed>=0.3",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
newskit = "newskit.cli:main"

[project.urls]
Source = "https://github.com/lfoletti/newskit"
Issues = "https://github.com/lfoletti/newskit/issues"

[tool.hatch.version]
path = "src/newskit/__init__.py"     # une seule source de la version

[tool.hatch.build.targets.wheel]
packages = ["src/newskit"]

[tool.hatch.build.targets.sdist]
include = ["src/newskit", "tests", "README.md", "README.fr.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/newskit/donnees_temoin/tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/newskit/donnees_temoin/dossier", "src/newskit/donnees_temoin/reponses"]

[tool.ruff.lint]
# L'analyse statique de la CI : les erreurs réelles (noms indéfinis, imports inutilisés, syntaxe), pas le style
# hérité du moteur.
select = ["F", "E9"]
ignore = ["F401", "F841", "E741"]
